spring.application.name=connect-chat

spring.datasource.url=jdbc:postgresql://localhost:5432/connectchat
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Gere uma chave aleatória de pelo menos 32 bytes e configure a variável
# CONNECTCHAT_JWT_SECRET_BASE64 no ambiente. Não versione a chave.
connectchat.jwt.secret-base64=${CONNECTCHAT_JWT_SECRET_BASE64}
connectchat.jwt.issuer=https://connectchat.local
connectchat.jwt.access-token-ttl=PT15M
# Ticket opaco, descartável e usado somente para iniciar o WebSocket.
connectchat.websocket.ticket-ttl=PT30S
